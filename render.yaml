services:
  - type: web
    name: face-mask-detection
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_ENABLE_ONEDNN_OPTS
        value: 0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
